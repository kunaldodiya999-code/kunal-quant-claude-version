[server]
# The engine saves the chart data in static/live/chart.json and the chart fetches it.
enableStaticServing = true
headless = false

[theme]
base = "dark"
backgroundColor = "#131722"
secondaryBackgroundColor = "#1e222d"
textColor = "#d1d4dc"
primaryColor = "#2962ff"

[browser]
gatherUsageStats = false
